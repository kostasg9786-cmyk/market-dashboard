<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate All-in-One Global Macro Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --success: #4ade80;
            --warning: #fbbf24;
            --danger: #f87171;
        }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 1600px; margin: 0 auto; }
        header { background: linear-gradient(135deg, #1e40af, #0369a1); padding: 25px; border-radius: 12px; margin-bottom: 25px; text-align: center; }
        header h1 { margin: 0; font-size: 2.2rem; }
        header p { margin: 8px 0 0 0; color: #bae6fd; }
        .fx-bar { text-align: center; margin-bottom: 20px; font-size: 1.1rem; color: var(--success); font-weight: bold; background: rgba(74, 222, 128, 0.1); padding: 10px; border-radius: 8px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
        .card { background: var(--card-bg); padding: 22px; border-radius: 12px; border-left: 6px solid var(--primary); transition: transform 0.2s; }
        .card:hover { transform: translateY(-4px); }
        .card.score-high { border-left-color: var(--success); }
        .card.score-mid { border-left-color: var(--warning); }
        .card.score-low { border-left-color: var(--danger); }
        h3 { margin-top: 0; font-size: 1.3rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .macro-score { font-size: 1.3rem; font-weight: bold; padding: 2px 8px; border-radius: 4px; background: rgba(255,255,255,0.05); }
        .score-high .macro-score { color: var(--success); }
        .score-mid .macro-score { color: var(--warning); }
        .score-low .macro-score { color: var(--danger); }
        .section-title { font-size: 0.8rem; text-transform: uppercase; color: var(--primary); font-weight: bold; margin: 15px 0 6px 0; letter-spacing: 0.5px; }
        .metric { display: flex; justify-content: space-between; margin: 5px 0; font-size: 1rem; }
        .metric label { color: var(--text-muted); }
        .metric span { font-weight: 600; }
        .price-highlight { font-size: 1.25rem; font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Global Macro Investing Dashboard 🌐</h1>
        <p>Πλήρης Ολιστική Εικόνα: Αποτιμήσεις, Πληθωρισμός, Επιτόκια & Live Τιμές σε Ευρώ (€)</p>
    </header>

    <div class="fx-bar" id="fx-rate">💶 Live Ισοτιμία EUR/USD: Φόρτωση...</div>

    <div class="grid" id="macro-grid">
        <!-- Φόρτωση καρτών αυτόματα -->
    </div>
</div>

<script>
let usdToEurRate = 0.91;

// Ολοκληρωμένη παγκόσμια λίστα macro με όλες τις σημαντικές οικονομίες
const macroMarkets = [
    { name: "Ελλάδα", ticker: "GREK", pe: 11.60, shillerPe: 12.10, gdp: 1.8, inflation: 2.4, rate: 3.25, yield: 3.80, icon: "🇬🇷", region: "Ευρώπη" },
    { name: "Φιλιππίνες", ticker: "EPHE", pe: 7.54, shillerPe: 9.20, gdp: 3.3, inflation: 3.1, rate: 5.75, yield: 2.90, icon: "🇵🇭", region: "Αναδυόμενες Ασία" },
    { name: "Ηνωμένες Πολιτείες (ΗΠΑ)", ticker: "SPY", pe: 23.85, shillerPe: 31.40, gdp: 2.3, inflation: 2.5, rate: 4.50, yield: 1.35, icon: "🇺🇸", region: "Βόρεια Αμερική" },
    { name: "Κίνα", ticker: "MCHI", pe: 10.80, shillerPe: 11.30, gdp: 4.1, inflation: 0.6, rate: 3.10, yield: 2.40, icon: "🇨🇳", region: "Αναδυόμενες Ασία" },
    { name: "Ινδία", ticker: "INDA", pe: 25.40, shillerPe: 28.90, gdp: 6.5, inflation: 4.8, rate: 6.50, yield: 1.20, icon: "🇮🇳", region: "Αναδυόμενες Ασία" },
    { name: "Γερμανία", ticker: "EWG", pe: 17.47, shillerPe: 16.80, gdp: 0.7, inflation: 2.0, rate: 3.25, yield: 2.80, icon: "🇩🇪", region: "Ευρώπη" },
    { name: "Ηνωμένο Βασίλειο", ticker: "EWU", pe: 16.37, shillerPe: 15.20, gdp: 1.0, inflation: 2.2, rate: 4.75, yield: 3.95, icon: "🇬🇧", region: "Ευρώπη" },
    { name: "Ιαπωνία", ticker: "EWJ", pe: 18.68, shillerPe: 22.10, gdp: 0.6, inflation: 2.1, rate: 0.25, yield: 1.80, icon: "🇯🇵", region: "Αναπτυγμένες Ασία" },
    { name: "Βραζιλία", ticker: "EWZ", pe: 8.20, shillerPe: 9.50, gdp: 2.1, inflation: 4.2, rate: 10.50, yield: 6.10, icon: "🇧🇷", region: "Λατινική Αμερική" }
];

function calculateMacroScore(market) {
    let score = 5;
    if (market.pe < 12) score += 2;
    else if (market.pe > 22) score -= 2;
    if (market.gdp > 2.5 && market.pe < 15) score += 1.5;
    if (market.gdp < 1.0 && market.pe > 15) score -= 1.5;
    if (market.yield > 3.5) score += 0.5;
    if (market.inflation > 4.5) score -= 0.5; // Ποινή υψηλού πληθωρισμού
    return Math.max(1, Math.min(10, score.toFixed(1)));
}

function getScoreClass(score) {
    if (score >= 6.8) return "score-high";
    if (score >= 4.5) return "score-mid";
    return "score-low";
}

function renderDashboard() {
    const grid = document.getElementById('macro-grid');
    grid.innerHTML = '';
    
    macroMarkets.forEach(market => {
        const score = calculateMacroScore(market);
        const scoreClass = getScoreClass(score);
        
        const card = document.createElement('div');
        card.className = `card ${scoreClass}`;
        card.innerHTML = `
            <h3>
                <span>${market.icon} ${market.name} <small style="font-size:0.75rem; color:var(--text-muted);">(${market.region})</small></span> 
                <span class="macro-score">Score: ${score}</span>
            </h3>
            
            <div class="section-title">Αποτίμηση & Αποδόσεις</div>
            <div class="metric"><label>Τρέχον P/E:</label> <span>${market.pe.toFixed(2)}</span></div>
            <div class="metric"><label>Shiller P/E (CAPE):</label> <span>${market.shillerPe.toFixed(2)}</span></div>
            <div class="metric"><label>Μερισματική Απόδοση:</label> <span style="color:var(--success);">${market.yield.toFixed(2)}%</span></div>
            
            <div class="section-title">Μακροοικονομικά Στοιχεία</div>
            <div class="metric"><label>Ρυθμός ΑΕΠ (2026):</label> <span>+${market.gdp}%</span></div>
            <div class="metric"><label>Πληθωρισμός:</label> <span style="color:var(--danger);">${market.inflation}%</span></div>
            <div class="metric"><label>Επιτόκιο Κεντρ. Τράπεζας:</label> <span style="color:var(--warning);">${market.rate.toFixed(2)}%</span></div>
            
            <div class="section-title">Τιμή ETF (Live σε €)</div>
            <div class="metric"><label>Τιμή σε Ευρώ:</label> <span id="price-eur-${market.ticker}" class="price-highlight">Φόρτωση...</span></div>
            <div class="metric"><label>Τιμή σε Δολάριο:</label> <span id="price-usd-${market.ticker}" style="font-size:0.9rem; color:var(--text-muted);">Φόρτωση...</span></div>
        `;
        grid.appendChild(card);
    });
}

async function loadAllMacroData() {
    try {
        // Live Φόρτωση Ισοτιμίας από ελεύθερο API χωρίς Key
        const fxRes = await fetch('https://er-api.com');
        const fxData = await fxRes.json();
        usdToEurRate = fxData.rates.EUR;
        const eurUsd = 1 / usdToEurRate;
        document.getElementById('fx-rate').innerText = `💶 Live Ισοτιμία EUR/USD: ${eurUsd.toFixed(4)}`;
    } catch (e) { console.log("FX API Fallback"); }

    renderDashboard();

    // Live Φόρτωση τιμών ETFs από ελεύθερο proxy χωρίς κανένα περιορισμό
    macroMarkets.forEach(async (market) => {
        try {
            const res = await fetch(`https://yahoo.com{market.ticker}`);
            const data = await res.json();
            const priceUsd = data.chart.result[0].meta.regularMarketPrice;
            const priceEur = priceUsd * usdToEurRate;
            
            document.getElementById(`price-usd-${market.ticker}`).innerText = `$${priceUsd.toFixed(2)}`;
            document.getElementById(`price-eur-${market.ticker}`).innerHTML = `€${priceEur.toFixed(2)}`;
        } catch (error) {
            document.getElementById(`price-eur-${market.ticker}`).innerHTML = `<span style="color:var(--warning)">Κλειστή Αγορά</span>`;
        }
    });
}

loadAllMacroData();
setInterval(loadAllMacroData, 60000); // Ανανέωση ανά λεπτό
</script>

</body>
</html>
